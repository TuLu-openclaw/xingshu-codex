name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 写入卡密授权配置（来自 secret）
        shell: pwsh
        env:
          LICENSE_JSON: ${{ secrets.LICENSE_CONFIG_JSON }}
        run: |
          if (-not $env:LICENSE_JSON) {
            throw "缺少仓库 secret LICENSE_CONFIG_JSON（内容为 license.config.json 的全文）"
          }
          [IO.File]::WriteAllText("$PWD\license.config.json", $env:LICENSE_JSON, (New-Object Text.UTF8Encoding($false)))
          $c = $env:LICENSE_JSON | ConvertFrom-Json
          Write-Host ("授权配置已写入：appid=" + $c.appid + " success=" + $c.success)

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 构建渲染层
        run: npm run build

      - name: 准备 NSIS（真正的安装包）
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'nsis'
          $url = 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10.zip'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $zip $url
          if (-not (Test-Path $zip)) { throw 'NSIS 下载失败' }
          Write-Host ("nsis.zip " + (Get-Item $zip).Length + " bytes")
          Expand-Archive $zip -DestinationPath $dir -Force
          $mk = Get-ChildItem $dir -Recurse -Filter makensis.exe | Select-Object -First 1
          if (-not $mk) { throw 'NSIS 解压后找不到 makensis.exe' }
          "MAKENSIS=$($mk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host ("makensis: " + $mk.FullName)

      - name: 打包（便携版 + 安装版）
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python scripts/package.py

      - name: 校验产物
        shell: pwsh
        run: |
          Get-ChildItem release -File | ForEach-Object {
            Write-Host ("{0}  {1} bytes" -f $_.Name, $_.Length)
          }
          $zip = Get-ChildItem release -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "没有产出 zip" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $a = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $names = $a.Entries.FullName
          foreach ($need in @("星枢破甲工具.exe", "resources/app/package.json", "resources/license.config.json")) {
            if ($names -notcontains $need) { throw "zip 内缺少 $need" }
          }
          $a.Dispose()
          Write-Host "zip 结构校验通过"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: xingshu-kit-windows-x64
          path: |
            release/*.zip
            release/*.exe
          compression-level: 0
          retention-days: 14

      # 直接发到 Release：用户从网页点下载比拉 Actions artifact 稳得多
      - name: 发布到 Release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v5.0.0"
          # gh 上传会把中文文件名弄成 "-.-5.0.0.exe"，先改成 ASCII 再传
          $zip = Get-ChildItem release -Filter *便携版*.zip | Select-Object -First 1
          $exe = Get-ChildItem release -Filter *安装版*.exe | Select-Object -First 1
          if ($zip) { Copy-Item $zip.FullName (Join-Path release "xingshu-kit-5.0.0-win-x64-portable.zip") -Force }
          if ($exe) { Copy-Item $exe.FullName (Join-Path release "xingshu-kit-5.0.0-win-x64-setup.exe") -Force }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "星枢破甲工具 $tag" --notes "CI 构建" }
          Get-ChildItem release -File | Where-Object { $_.Name -like "xingshu-kit-*" } | ForEach-Object {
            Write-Host ("上传 " + $_.Name)
            gh release upload $tag $_.FullName --clobber
          }
          gh release view $tag --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
